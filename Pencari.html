<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Terrain Scanner</title>
  <style>
    :root {
      color-scheme: dark;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #07131b, #10253a);
      font-family: Arial, Helvetica, sans-serif;
      color: #eafaf1;
    }

    .wrapper {
      text-align: center;
      padding: 24px;
    }

    h1 {
      margin: 0 0 16px;
      font-size: 28px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .status-line {
      margin: 0 0 14px;
      font-size: 14px;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: #90f0b4;
    }

    .scene {
      position: relative;
      width: min(90vw, 760px);
      aspect-ratio: 1.35 / 1;
      border: 2px solid rgba(255,255,255,0.2);
      border-radius: 18px;
      overflow: hidden;
      background: linear-gradient(180deg, #1b4d2f 0%, #0d291f 100%);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
    }

    .popup {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(3, 12, 8, 0.55);
      backdrop-filter: blur(4px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
      z-index: 5;
    }

    .popup.show {
      opacity: 1;
      pointer-events: auto;
    }

    .person-card {
      width: min(84%, 360px);
      background: rgba(255, 255, 255, 0.95);
      color: #123;
      border-radius: 18px;
      padding: 22px;
      box-shadow: 0 18px 40px rgba(0,0,0,0.3);
      text-align: left;
      transform: translateY(14px) scale(0.95);
      opacity: 0;
      transition: transform 0.35s ease, opacity 0.35s ease;
    }

    .popup.show .person-card {
      transform: translateY(0) scale(1);
      opacity: 1;
    }

    .person-card h2 {
      margin: 0 0 10px;
      font-size: 24px;
      color: #0f4d2c;
    }

    .photo-box {
      width: 100%;
      height: 170px;
      border-radius: 12px;
      margin-bottom: 12px;
      background: linear-gradient(135deg, #b8f5c6, #5cbf7a);
      display: grid;
      place-items: center;
      overflow: hidden;
      border: 2px solid #9dd7a8;
    }

    .photo-box span {
      font-size: 54px;
      font-weight: 700;
      color: #194b2e;
    }

    .label {
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      color: #5f6d7a;
      margin-bottom: 4px;
    }

    .value {
      font-size: 17px;
      font-weight: 600;
      margin-bottom: 10px;
    }

    .status {
      margin-top: 12px;
      display: inline-block;
      padding: 8px 12px;
      border-radius: 999px;
      background: #0f4d2c;
      color: white;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.8px;
    }

    .terrain {
      position: absolute;
      inset: 0;
      display: grid;
      grid-template-columns: repeat(14, 1fr);
      gap: 8px;
      padding: 18px;
      background: linear-gradient(180deg, rgba(255,255,255,0.03), rgba(0,0,0,0.14));
    }

    .tile {
      border-radius: 6px;
      background: rgba(255,255,255,0.11);
      border: 1px solid rgba(255,255,255,0.08);
      box-shadow: inset 0 0 4px rgba(255,255,255,0.06);
      position: relative;
    }

    .tile:nth-child(3n) { background: rgba(85, 131, 77, 0.55); }
    .tile:nth-child(5n) { background: rgba(122, 173, 97, 0.45); }
    .tile:nth-child(7n) { background: rgba(63, 102, 51, 0.7); }
    .tile:nth-child(11n) { background: rgba(30, 70, 35, 0.8); }

    .tile::after {
      content: "";
      position: absolute;
      inset: 18%;
      border-radius: 50%;
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.16);
      opacity: 0.7;
    }

    .tile:nth-child(8n),
    .tile:nth-child(13n),
    .tile:nth-child(19n),
    .tile:nth-child(24n),
    .tile:nth-child(29n),
    .tile:nth-child(35n) {
      background: transparent;
      border: 1px dashed rgba(255,255,255,0.16);
      box-shadow: none;
    }

    .found-marker {
      position: absolute;
      top: 24px;
      right: 24px;
      z-index: 4;
      padding: 10px 14px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.92);
      color: #0f4d2c;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      box-shadow: 0 8px 24px rgba(0,0,0,0.25);
      opacity: 0;
      transform: translateY(-8px) scale(0.95);
      transition: all 0.35s ease;
      pointer-events: none;
    }

    .location-dot {
      position: absolute;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #fff;
      border: 2px solid #2dff8d;
      box-shadow: 0 0 0 4px rgba(45,255,141,0.2);
      transform: translate(-50%, -50%);
      z-index: 2;
      animation: pulse 1.2s ease-in-out infinite;
    }

    .found-marker.show {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .scanner {
      position: absolute;
      top: 0;
      left: 0;
      width: 16%;
      height: 100%;
      background: rgba(0, 255, 120, 0.23);
      border: 1px solid rgba(255,255,255,0.3);
      box-shadow: inset 0 0 18px rgba(0, 255, 120, 0.25), 0 0 18px rgba(0, 255, 120, 0.28);
      backdrop-filter: blur(4px);
      animation: scan 2.6s ease-in-out infinite alternate;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .scanner.stopped {
      animation: none;
      opacity: 0.8;
    }

    .scanner::before {
      content: "";
      position: absolute;
      inset: 0;
      border-left: 3px solid rgba(255,255,255,0.75);
      border-right: 3px solid rgba(255,255,255,0.35);
      opacity: 0.8;
    }

    .scanner::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.12), transparent);
      animation: glow 1.2s linear infinite;
    }

    @keyframes scan {
      from {
        transform: translateX(0);
      }
      to {
        transform: translateX(500%);
      }
    }

    @keyframes glow {
      from {
        transform: translateX(-100%);
      }
      to {
        transform: translateX(100%);
      }
    }

    @keyframes pulse {
      0%, 100% {
        transform: translate(-50%, -50%) scale(1);
        opacity: 1;
      }
      50% {
        transform: translate(-50%, -50%) scale(1.3);
        opacity: 0.65;
      }
    }
  </style>
</head>

  <script>
    window.addEventListener('load', () => {
      const marker = document.getElementById('foundMarker');
      const popup = document.getElementById('popup');
      const scanner = document.querySelector('.scanner');

      setTimeout(() => {
        marker.classList.add('show');
      }, 5000);

      setTimeout(() => {
        popup.classList.add('show');
        scanner.classList.add('stopped');
      }, 10000);
    });
